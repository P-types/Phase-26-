[project]
name = "ai-studio-internship"
version = "0.1.0"
description = "Learning projects for an AI Studio internship"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
]

[project.scripts]
ai-studio-internship = "ai_studio_internship:main"
ticket-import = "ai_studio_internship.tickets:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
